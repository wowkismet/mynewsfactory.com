# /etc/nginx/sites-available/mynewsfactory.com
#
# Replaces the static placeholder vhost with a reverse proxy to the Next.js
# server on 127.0.0.1:3000. Run certbot afterwards; it rewrites this file to
# add the TLS listener and the HTTP -> HTTPS redirect.

server {
    listen 80;
    listen [::]:80;
    server_name mynewsfactory.com www.mynewsfactory.com;

    server_tokens off;
    client_max_body_size 25m;

    add_header X-Content-Type-Options "nosniff"                       always;
    add_header X-Frame-Options        "SAMEORIGIN"                    always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # Immutable build assets — safe to cache hard.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    location ~ /\. { deny all; }
}
